name: Upload Release Asset
on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: release
      VERSION_TYPE: ${{ github.event.release.prerelease && 'beta' || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version minecraft_version_range'

      - name: Read Versions
        id: versions
        uses: Gu-ZT/toml-reader-action@1.0.0
        with:
          file: gradle/libs.versions.toml
          fields: |
            versions.minecraft
            versions.neoforge
            versions.anvillib
            versions.ageratum
            versions.anvilcraft

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Make gradlew Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build
        run: ./gradlew build

      - name: Get Version
        id: version
        run: |
          MESSAGE=$(ls build/libs/* | grep sources.jar -v | grep shadow.jar -v | grep slim.jar -v | awk -F '${{ steps.properties.outputs.mod_id }}-neoforge-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}.jar

      - name: Publish to Maven
        run: ./gradlew publish
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        continue-on-error: true

      - name: Publish Mod
        uses: KirA-NT/mc-publish@v3.3.1
        continue-on-error: true
        with:
          name: "${{ steps.properties.outputs.mod_name }} For NeoForge v${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ env.VERSION_TYPE }}
          java: ${{ steps.properties.outputs.java_version }}
          fail-mode: skip
          changelog: Early test version, please download and play with caution. 早期测试版本，请谨慎下载游玩
          dependencies: |
            anvil-lib(embedded){modrinth:nKAcAL9b}{curseforge:1484302}
            ageratum(embedded){modrinth:9YApuDd3}{curseforge:1500610}
            anvilcraft(required){modrinth:vuISAWPc}{curseforge:986251}

          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}.jar
            build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}-sources.jar
