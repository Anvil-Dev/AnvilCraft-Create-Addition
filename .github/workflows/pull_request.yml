name: Pull Request Check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - releases/**
      - dev/**
    paths:
      - src/**
      - gradle/**
      - build.gradle
      - dependencies.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: pr
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version minecraft_version_range'

      - name: Read Versions
        id: versions
        uses: Gu-ZT/toml-reader-action@1.0.0
        with:
          file: gradle/libs.versions.toml
          fields: |
            versions.minecraft
            versions.neoforge
            versions.anvillib
            versions.ageratum
            versions.anvilcraft

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v5.6.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Make gradlew Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build
        run: ./gradlew build

      - name: Get Version
        id: version
        run: |
          MESSAGE=$(ls build/libs/* | grep sources.jar -v | grep shadow.jar -v | grep slim.jar -v | awk -F '${{ steps.properties.outputs.mod_id }}-neoforge-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}.jar

      - name: GameTest
        uses: Anvil-Dev/dedicated-server-launch-test@universal
        continue-on-error: false
        with:
          mod_loader: neoforge
          loader_version: ${{ steps.versions.outputs.versions_neoforge }}
          mods: build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}.jar
          maven-repos: |
            https://server.cjsah.net:1002/maven/
          maven-mods: |
            dev.anvilcraft.lib:anvillib-neoforge-1.21.1:${{ steps.versions.outputs.versions_anvillib }}
            dev.anvilcraft.resource:ageratum-neoforge-1.21.1:${{ steps.versions.outputs.versions_ageratum }}
            dev.dubhe:anvilcraft-neoforge-1.21.1:${{ steps.versions.outputs.versions_anvilcraft }}
